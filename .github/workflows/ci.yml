name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://planner:ci-only@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test (unit and integration)
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: planner_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    env:
      E2E_DATABASE_URL: postgres://planner:ci-only@localhost:5432/planner_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: type-check
        run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: end-to-end
        run: npx playwright test
